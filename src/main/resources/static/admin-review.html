<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FixMyPlaylist 평가 검수</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #20242b; background: #f4f6f8; }
        body { max-width: 1120px; margin: 32px auto; padding: 0 18px; }
        h1 { margin-bottom: 8px; }
        .subtle { color: #626b78; }
        .toolbar, .case { background: white; border: 1px solid #dce1e7; border-radius: 10px; padding: 16px; margin: 14px 0; }
        .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        input, select, textarea, button { font: inherit; padding: 9px 11px; border: 1px solid #c6cdd6; border-radius: 6px; }
        input[type=password] { min-width: min(360px, 80vw); }
        button { cursor: pointer; color: white; background: #2456a6; border-color: #2456a6; }
        button.secondary { background: white; color: #2456a6; }
        button:disabled { opacity: .55; cursor: wait; }
        .case h2 { margin: 0 0 12px; font-size: 1.05rem; overflow-wrap: anywhere; }
        .titles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .title { background: #f6f8fa; padding: 10px; border-radius: 6px; overflow-wrap: anywhere; }
        .meta { margin: 10px 0; color: #626b78; font-size: .92rem; }
        .review { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: start; margin-top: 12px; }
        textarea { min-height: 40px; resize: vertical; }
        #message { min-height: 1.5em; }
        @media (max-width: 700px) { .titles, .review { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<h1>평가 사례 사람 검수</h1>
<p class="subtle">AI 평가 내용을 확인하고 SUCCESS 또는 FAIL과 검수 사유를 제출합니다.</p>
<section class="toolbar">
    <label for="secret">관리자 시크릿</label>
    <input id="secret" type="password" autocomplete="off" placeholder="X-Evaluation-Secret">
    <button id="load">검수 대기 목록 조회</button>
    <button id="retry" class="secondary">색인 실패 재시도</button>
</section>
<p id="message" role="status" aria-live="polite" class="subtle"></p>
<main id="cases"></main>
<script>
    const secretInput = document.querySelector('#secret');
    const message = document.querySelector('#message');
    const casesContainer = document.querySelector('#cases');
    const loadButton = document.querySelector('#load');
    const headers = () => ({'X-Evaluation-Secret': secretInput.value});

    async function request(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {...headers(), ...(options.headers || {})}
        });
        if (!response.ok) throw new Error(await response.text() || `HTTP ${response.status}`);
        return response.status === 204 ? null : response.json().catch(() => null);
    }

    function addText(parent, tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        element.textContent = text ?? '';
        parent.append(element);
        return element;
    }

    async function loadCases() {
        loadButton.disabled = true;
        message.textContent = '목록을 불러오는 중입니다.';
        casesContainer.replaceChildren();
        try {
            const cases = await request('/api/admin/rag/review/pending');
            casesContainer.replaceChildren();
            for (const item of cases || []) renderCase(item);
            message.textContent = `${(cases || []).length}건의 검수 대기 사례`;
        } catch (error) {
            message.textContent = `목록 조회 실패: ${error.message}`;
        } finally {
            loadButton.disabled = false;
        }
    }

    function renderCase(item) {
        const card = document.createElement('section');
        card.className = 'case';
        addText(card, 'h2', '', `EvaluationCase ${item.evaluationCaseId}`);
        const titles = document.createElement('div');
        titles.className = 'titles';
        addText(titles, 'div', 'title', `Target: ${item.targetTitle}`);
        addText(titles, 'div', 'title', `Source: ${item.sourceTitle}`);
        card.append(titles);
        const confidence = item.aiConfidence == null ? '없음' : Number(item.aiConfidence).toFixed(3);
        addText(card, 'p', 'meta', `AI 판정: ${item.aiLabel ?? '없음'} · confidence ${confidence} · 평가 시각 ${item.evaluatedAt ?? '없음'}`);

        const form = document.createElement('form');
        form.className = 'review';
        const label = document.createElement('select');
        label.setAttribute('aria-label', '사람 판정');
        for (const value of ['SUCCESS', 'FAIL']) {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            label.append(option);
        }
        const reason = document.createElement('textarea');
        reason.required = true;
        reason.maxLength = 4000;
        reason.placeholder = '사람 검수 사유, 최대 4000자';
        const submit = document.createElement('button');
        submit.type = 'submit';
        submit.textContent = '검수 및 승격';
        form.append(label, reason, submit);
        form.addEventListener('submit', async event => {
            event.preventDefault();
            submit.disabled = true;
            try {
                const result = await request(`/api/admin/rag/promote/${encodeURIComponent(item.evaluationCaseId)}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({humanLabel: label.value, humanReason: reason.value})
                });
                card.remove();
                const remaining = casesContainer.children.length;
                message.textContent = result?.failed
                    ? `검수 저장 완료. Qdrant 색인 ${result.failed}건 실패, 재시도 대기 중입니다. 남은 대기 ${remaining}건.`
                    : `검수 저장 및 Qdrant 색인이 완료되었습니다. 남은 대기 ${remaining}건.`;
            } catch (error) {
                message.textContent = `검수 실패: ${error.message}`;
                submit.disabled = false;
            }
        });
        card.append(form);
        casesContainer.append(card);
    }

    loadButton.addEventListener('click', loadCases);
    document.querySelector('#retry').addEventListener('click', async event => {
        const button = event.currentTarget;
        button.disabled = true;
        try {
            const result = await request('/api/admin/rag/promotion/indexing/retry', {method: 'POST'});
            message.textContent = `색인 재시도 완료: 성공 ${result?.indexed ?? 0}건, 실패 ${result?.failed ?? 0}건`;
        } catch (error) {
            message.textContent = `색인 재시도 실패: ${error.message}`;
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
