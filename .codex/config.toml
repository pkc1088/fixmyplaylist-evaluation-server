[permissions.src-only]
description = "Allow source editing and build configuration reads."
extends = ":read-only"

[permissions.src-only.filesystem]
":root" = "deny"
":minimal" = "read"
"/home/pyeon/.codex/packages/app-server-daemon" = "read"

[permissions.src-only.filesystem.":workspace_roots"]
