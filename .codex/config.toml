default_permissions = "worktree-safe"

[permissions.worktree-safe]
description = "Allow source and documentation editing within the worktree."
extends = ":read-only"

[permissions.worktree-safe.filesystem]
":root" = "deny"
":minimal" = "read"
"/tmp" = "write"
"/home/pyeon/.codex/packages/app-server-daemon" = "read"
"/home/pyeon/.gradle" = "write"
"/usr/lib/jvm/java-17-openjdk-amd64" = "read"

[permissions.worktree-safe.filesystem.":workspace_roots"]
"src" = "write"
"docs" = "write"
"build" = "write"
".gradle" = "write"
"README.md" = "read"
"AGENTS.md" = "read"
"build.gradle" = "read"
"settings.gradle" = "read"
"gradlew" = "read"
"gradle" = "read"

[features]
network_proxy = true

[permissions.worktree-safe.network]
enabled = true

[permissions.worktree-safe.network.domains]
"services.gradle.org" = "allow"
"plugins.gradle.org" = "allow"
"repo.maven.apache.org" = "allow"