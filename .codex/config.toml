default_permissions = "src-only"

[permissions.src-only]
description = "Allow source editing and build configuration reads."
extends = ":read-only"

[permissions.src-only.filesystem]
":root" = "deny"
":minimal" = "read"
"/tmp" = "write"
"/home/pyeon/.codex/packages/app-server-daemon" = "read"
"/home/pyeon/.gradle" = "write"
"/usr/lib/jvm/java-17-openjdk-amd64" = "read"

[permissions.src-only.filesystem.":workspace_roots"]
"src" = "write"
"docs" = "write"
"build" = "write"
".gradle" = "write"
"README.md" = "read"
"AGENTS.md" = "read"
"build.gradle" = "read"
"settings.gradle" = "read"
"gradlew" = "read"
"gradle" = "read"

[features]
network_proxy = true

[permissions.src-only.network]
enabled = true

[permissions.src-only.network.domains]
"services.gradle.org" = "allow"
"plugins.gradle.org" = "allow"
"repo.maven.apache.org" = "allow"

